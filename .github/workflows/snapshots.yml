# Renders the Linux visual-regression baselines on the same runner image the
# Quality workflow uses, and uploads them as an artifact. Nothing is committed
# from CI: download the artifact, look at the images, and commit them yourself.
# Run it after an intentional visual change (or when a new page gets a snapshot).
name: Snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render Linux baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Render baselines
        run: pnpm exec playwright test tests/e2e/visual.spec.ts --update-snapshots

      - name: Upload baselines
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: visual-baselines-linux
          path: tests/e2e/visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
