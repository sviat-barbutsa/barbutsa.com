  <line x1="96" y1="762" x2="1504" y2="762" stroke="#34382d" stroke-width="2" />
  <text x="96" y="813" fill="#aaa696" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" letter-spacing="2">
